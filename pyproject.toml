[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradecopilot"
version = "0.1.0"
description = "Deterministic, analysis-only low-float momentum trading copilot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private" }
dependencies = [
  "alpaca-py>=0.43.5,<1",
  "keyring>=25.7,<26",
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
openai = ["openai>=1.99,<3"]

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
tradecopilot = "tradecopilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradecopilot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tradecopilot"]
