name: Offline validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned uv and frozen dependencies
        run: |
          python -m pip install uv==0.11.3
          uv sync --frozen --group dev --extra openai --extra plots
      - name: Lint, type-check, and test
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy src
          uv run --no-sync pytest
      - name: Produce an offline synthetic report
        run: uv run --frozen tradecopilot forecast demo --output-dir .tradecopilot/ci-demo
      - name: Produce and verify the offline Kronos viewer demo
        run: |
          uv run --no-sync tradecopilot forecast kronos demo --output-dir "$GITHUB_WORKSPACE/.tradecopilot/ci-kronos-demo"
          uv run --no-sync python -c "from pathlib import Path; import sys; from tradecopilot.forecast.kronos_report import load_report; r=load_report(Path(sys.argv[1])); assert r['connection']=={'mode':'synthetic'}; assert len(r['cases'])==4; assert all(not m['metrics']['evaluated'] for m in r['models'].values())" "$GITHUB_WORKSPACE/.tradecopilot/ci-kronos-demo/report.json"
      - name: Build the runtime image
        run: docker build --tag tradecopilot-forecast:ci .
      - name: Verify the container with networking disabled
        run: |
          docker run --detach --name forecast-ci --network none tradecopilot-forecast:ci
          for attempt in $(seq 1 45); do
            container_state=$(docker inspect --format '{{.State.Health.Status}}' forecast-ci)
            if [ "$container_state" = healthy ]; then
              docker exec forecast-ci python -c "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8766/api/report')); assert r['evaluation_kind']=='synthetic_demo'; assert any(m['execution']=='fixture' for m in r['models'])"
              exit 0
            fi
            if [ "$container_state" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          docker logs forecast-ci
          exit 1
      - name: Remove the test container and its synthetic data
        if: always()
        run: docker rm --force --volumes forecast-ci 2>/dev/null || true
      - name: Save only the synthetic report bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-forecast-demo
          path: |
            .tradecopilot/ci-demo/run/
            .tradecopilot/ci-kronos-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  optional-rl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install frozen CPU RL dependencies
        run: |
          python -m pip install uv==0.11.3
          uv sync --frozen --group dev --extra rl --extra kronos
      - name: Verify simulator and supervised neural studies with synthetic fixtures
        run: >-
          uv run --no-sync pytest
          tests/test_rl_core.py tests/test_rl_data.py tests/test_rl_training.py
          tests/test_rl_evaluation.py tests/test_rl_study.py
          tests/test_supervised_data.py tests/test_supervised_models.py
          tests/test_supervised_study.py
          tests/test_forecast_kronos.py tests/test_kronos_vendor.py
